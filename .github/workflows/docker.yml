name: Docker

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quickdraw:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run CLI
        run: docker run --rm quickdraw:test --help
