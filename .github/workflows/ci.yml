name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 3 * * *'    # daily 3am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '20', cache: 'npm' }
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # Coverage thresholds (>=70% lines) are enforced in vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run build
      # Smoke-test the built CLI: help + a keyless preflight must exit cleanly.
      - run: node dist/bin/cli.js --help
      - run: DRY_RUN=true node dist/bin/cli.js bench --providers openai,anthropic --runs 1 --prompt-file ./bench/standard-prompt.md

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: quickdraw:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dry-run:
    name: Dry run smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '20', cache: 'npm' }
      - run: npm install --no-audit --no-fund
      - run: npm run bench:dry

  publish-npm:
    name: Publish npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, docker, dry-run]
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '20', registry-url: 'https://registry.npmjs.org' }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --provenance --access public
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }

  nightly-bench:
    name: Nightly bench → publish results
    if: github.ref == 'refs/heads/master' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_BENCH }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_BENCH }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '20', cache: 'npm' }
      - run: npm install --no-audit --no-fund && npm run build
      # Real benchmark via the built CLI against the committed standard prompt.
      - run: node dist/bin/cli.js bench --providers openai,anthropic --runs 10 --cost-cap 5 --prompt-file ./bench/standard-prompt.md --json ./public/results.json
      - run: |
          mkdir -p public
          {
            echo '<html><body><h1>quickdraw benchmarks</h1>'
            echo "<p>Last run: $(date -u)</p>"
            echo '<pre>'
            cat ./public/results.json
            echo '</pre></body></html>'
          } > public/index.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
