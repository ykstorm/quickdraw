name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; the publish job raises its own scope.
permissions:
  contents: read

jobs:

  test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Coverage thresholds (>=70% lines) are enforced in vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run build
      # Smoke-test the built CLI: help + a keyless preflight must exit cleanly.
      - run: node dist/bin/cli.js --help
      - run: DRY_RUN=true node dist/bin/cli.js bench --providers openai,anthropic --runs 1 --prompt-file ./bench/standard-prompt.md

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: quickdraw:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dry-run:
    name: Dry run smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run bench:dry

  publish-npm:
    name: Publish npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, docker, dry-run]
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22', registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      # npm publishes the version in package.json whatever the tag says, so a
      # tag that names another version would publish the wrong release.
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the package.json version ${expected}. Tag the commit as ${expected}, or set the version in package.json and tag again."
            exit 1
          fi
      - run: npm run build
      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with Node 22 is older.
      # Pinned to the 11.x line so a new major npm cannot change the release job unannounced.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
      # npm authenticates with the OIDC token, so no NODE_AUTH_TOKEN is set.
      - run: npm publish --provenance --access public
