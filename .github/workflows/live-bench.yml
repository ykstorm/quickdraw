name: Live bench (Anthropic)

# Paid, opt-in: runs the real quickdraw CLI against Claude Haiku and captures
# live TTFT / TPS / p50-p99 / cost. Manual dispatch ONLY — never on push/PR — so
# fork PRs can't reach the secret and every paid run is deliberate. Anthropic
# only (no OpenAI key needed), hard --cost-cap so spend can't run away. The key
# is passed as an env secret and read from process.env; never logged.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Runs against Haiku'
        default: '3'
      cost_cap:
        description: 'Hard USD ceiling'
        default: '0.5'

permissions:
  contents: read

jobs:
  live-anthropic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run build
      - name: Benchmark Claude Haiku (live)
        # Inputs are passed through env, not interpolated into the command line,
        # so a crafted input value cannot inject shell.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ github.event.inputs.runs }}
          COST_CAP: ${{ github.event.inputs.cost_cap }}
        run: >-
          node dist/bin/cli.js bench
          --providers anthropic
          --runs "$RUNS"
          --cost-cap "$COST_CAP"
          --prompt-file ./bench/standard-prompt.md
          --json ./bench/live-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-anthropic
          path: ./bench/live-results.json
